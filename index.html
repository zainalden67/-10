<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>اذكر 10</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--bg:#070b14;--panel:#101a2b;--panel2:#14223a;--blue:#168bff;--blue2:#0967c7;--text:#f4f7ff;--muted:#9aaac4;--line:#263a5a;--red:#ff5b70;--green:#35c98a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#102b50 0%,var(--bg) 58%);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;direction:rtl}
button,input{font:inherit}
.app{width:min(980px,100%);margin:auto;padding:22px 16px 40px}
header{text-align:center;padding:12px 0 18px}
.logo{font-size:clamp(38px,7vw,62px);font-weight:900;letter-spacing:-2px;color:#fff;text-shadow:0 0 28px #168bff70}
.logo span{color:var(--blue)}
.subtitle{color:var(--muted);font-size:14px}
.panel{background:linear-gradient(145deg,#121f34,#0d1626);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 15px 45px #0005}
h1,h2,h3,p{margin-top:0}
h2{font-size:24px;margin-bottom:12px}
label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}
input{width:100%;background:#080f1c;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;outline:none;text-align:right}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #168bff20}
.teams-input{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.btn{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;font-weight:800;cursor:pointer;transition:.18s;box-shadow:0 7px 20px #168bff25}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.secondary{background:#182944;border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%;margin-top:8px}
.hidden{display:none!important}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.team-card{background:#0b1423;border:2px solid var(--line);border-radius:16px;text-align:center;padding:12px}
.team-card.active{border-color:var(--blue);box-shadow:0 0 20px #168bff25}
.team-name{font-weight:800;color:#68b5ff}
.team-score{font-size:32px;font-weight:900;line-height:1.3}
.team-meta{font-size:13px;color:var(--muted)}
.roundline{text-align:center;color:var(--muted);margin:8px 0 16px}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:18px}
.category{background:linear-gradient(145deg,#14243c,#0d1728);border:1px solid #29466d;border-radius:15px;padding:18px 10px;color:#eaf4ff;font-weight:800;font-size:17px;cursor:pointer}
.category:hover{border-color:var(--blue);background:#18365b}
.question{text-align:center;font-size:20px;font-weight:800;margin:12px auto 18px;line-height:1.8}
.answers{display:grid;gap:7px}
.answer-row{display:flex;align-items:center;gap:10px;min-height:47px;background:#0b1423;border:1px solid #1d304c;border-radius:10px;overflow:hidden}
.num{width:42px;align-self:stretch;display:grid;place-items:center;background:#1a3151;font-weight:900;color:#dcecff}
.answer-text{flex:1;padding:7px 4px;text-align:right;font-weight:700}
.points{padding:0 13px;color:var(--muted);font-size:12px;white-space:nowrap}
.answer-row.found-blue .num{background:#0875d8}
.answer-row.found-other .num{background:#425a84}
.answer-row.reveal .num{background:#9a3445}
.entryline{display:flex;gap:9px;margin-top:16px}
.entryline input{flex:1;min-width:0}
.status{text-align:center;color:var(--muted);min-height:34px;padding:9px 4px;font-size:14px}
.status.good{color:var(--green)}.status.bad{color:var(--red)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.winner{text-align:center;font-size:27px;font-weight:900;color:#69b7ff;margin:22px 0}
@media(max-width:560px){.app{padding:12px 10px 28px}.panel{padding:15px}.teams-input{grid-template-columns:1fr}.category-grid{gap:8px}.category{font-size:15px;padding:15px 7px}.question{font-size:17px}.entryline{flex-direction:column}.entryline .btn{width:100%}.team-score{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">اذكر <span>10</span></div><div class="subtitle">تحدّي المعلومات • جميع المجالات • فريقان</div></header>
<section id="home" class="panel">
  <h2>أهلاً في لعبة اذكر 10</h2>
  <p class="subtitle">اختاروا أسماء الفرق، وبعدها ابدأوا التحدّي.</p>
  <div class="teams-input">
    <div><label for="team0">اسم الفريق الأول</label><input id="team0" value="الفريق الأزرق" maxlength="24"></div>
    <div><label for="team1">اسم الفريق الثاني</label><input id="team1" value="الفريق الثاني" maxlength="24"></div>
  </div>
  <button class="btn full" id="start">ابدأ اللعبة</button>
  <div class="small">تتغير الأسئلة عشوائياً عند اختيار المجال. لكل فريق ٣ أخطاء ودقيقة في دوره.</div>
</section>

<section id="pick" class="panel hidden">
  <h2 style="text-align:center">اختيار المجال</h2>
  <div id="pickScores" class="scoreboard"></div>
  <div id="roundInfo" class="roundline"></div>
  <div id="pickerInfo" class="roundline"></div>
  <div id="categories" class="category-grid"></div>
</section>

<section id="play" class="panel hidden">
  <div id="playScores" class="scoreboard"></div>
  <div id="question" class="question"></div>
  <div id="answers" class="answers"></div>
  <div class="entryline">
    <input id="guess" placeholder="اكتب إجابتك هنا..." autocomplete="off">
    <button class="btn" id="submit">تأكيد الإجابة</button>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <div class="actions"><button id="next" class="btn hidden">الجولة التالية</button></div>
</section>

<section id="final" class="panel hidden">
  <h2 style="text-align:center">انتهت جميع المجالات! النتيجة النهائية</h2>
  <div id="winner" class="winner"></div>
  <div id="finalScores" class="scoreboard"></div>
  <button id="restart" class="btn full">لعبة جديدة</button>
</section>
</div>

const $ = id => document.getElementById(id);
let names=[], total=[0,0], roundNo=0, used=new Set(), data=null, timer=null;

function show(id){["home","pick","play","final"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function teamCard(i, round=false){
 const active=round && data && data.turn===i && !data.over && !data.out[i];
 const lives=round && data ? "● ".repeat(data.lives[i])+"○ ".repeat(3-data.lives[i]) : "";
 const clock=round && data ? `${Math.floor(data.clock[i]/60)}:${String(data.clock[i]%60).padStart(2,"0")}` : "";
 return `<div class="team-card ${active?"active":""}"><div class="team-name">${escapeText(names[i])}</div><div class="team-score">${round?data.points[i]:total[i]}</div><div class="team-meta">${round?`${lives}　 ${clock}`:"النقاط الكلية"}</div></div>`;
}
function renderScores(target,round=false){$(target).innerHTML=teamCard(0,round)+teamCard(1,round)}
function startGame(){
 names=[$("team0").value.trim()||"الفريق الأول",$("team1").value.trim()||"الفريق الثاني"];
 total=[0,0];roundNo=0;used=new Set();showPick();
}
function showPick(){
 clearInterval(timer);data=null;show("pick");renderScores("pickScores");
 $("roundInfo").textContent=`المجال ${used.size+1} من ${Object.keys(BANK).length} • المتبقي ${Object.keys(BANK).length-used.size}`;
 const picker=roundNo%2;
 $("pickerInfo").textContent=`دور ${names[picker]} يختار المجال`;
 const available=Object.keys(BANK).filter(c=>!used.has(c));
 $("categories").innerHTML="";
 available.forEach(cat=>{
  const b=document.createElement("button");b.className="category";b.textContent=cat;
  b.onclick=()=>startRound(cat);$("categories").appendChild(b);
 });
}
function startRound(category){
 used.add(category);
 const [title,answers]=BANK[category][Math.floor(Math.random()*BANK[category].length)];
 data={category,title,answers:answers.slice(0,10),found:{},lives:[3,3],clock:[60,60],out:[false,false],points:[0,0],turn:roundNo%2,over:false};
 show("play");$("guess").disabled=false;$("submit").disabled=false;$("next").classList.add("hidden");
 $("guess").value="";renderPlay();$("guess").focus();timer=setInterval(tick,1000);
}
function renderPlay(){
 renderScores("playScores",true);
 $("question").innerHTML=`${escapeText(data.category)}<br>${escapeText(data.title)}<div class="team-meta">الدور الآن: ${escapeText(names[data.turn])}</div>`;
 $("answers").innerHTML=data.answers.map((a,i)=>{
  const found=Object.prototype.hasOwnProperty.call(data.found,i);
  const revealed=found||data.over;
  const cls=found?(data.found[i]===0?"found-blue":"found-other"):(data.over?"reveal":"");
  const answer=revealed?escapeText(a.split("|")[0]):"••••••••••";
  return `<div class="answer-row ${cls}"><div class="num">${i+1}</div><div class="answer-text">${answer}</div><div class="points">${i+1} نقاط</div></div>`;
 }).join("");
}
function normalize(s){
 return s.trim().toLowerCase().normalize("NFKD").replace(/[\u064B-\u065F\u0670\u0640]/g,"")
 .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ؤ]/g,"و").replace(/[ئ]/g,"ي")
 .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim().replace(/^ال(?=.{3,})/,"");
}
function matches(guess,answer){
 const g=normalize(guess);if(!g)return false;
 return answer.split("|").some(raw=>{
  const v=normalize(raw);
  return g===v || (g.length>=3&&(v.startsWith(g)||v.split(" ").some(w=>w.startsWith(g))));
 });
}
function message(text,type=""){ $("status").textContent=text;$("status").className="status "+type; }
function submitAnswer(){
 if(!data||data.over)return;
 const guess=$("guess").value.trim();$("guess").value="";if(!guess)return;
 const team=data.turn;let index=data.answers.findIndex((a,i)=>!Object.prototype.hasOwnProperty.call(data.found,i)&&matches(guess,a));
 if(index>=0){
  data.found[index]=team;data.points[team]+=index+1;
  message(`إجابة صحيحة! +${index+1} نقطة لـ ${names[team]}`,"good");
  renderPlay();if(Object.keys(data.found).length===data.answers.length)endRound();
 }else{
  data.lives[team]--;if(data.lives[team]<=0)data.out[team]=true;
  const other=1-team;
  if(!data.out[other]){data.turn=other;message(`إجابة غير صحيحة. انتقل الدور إلى ${names[other]}`,"bad")}
  else if(data.out[team]){endRound();return}
  renderPlay();
 }
 if(!data.over)$("guess").focus();
}
function tick(){
 if(!data||data.over)return;
 const t=data.turn;
 if(!data.out[t]){
  data.clock[t]--;
  if(data.clock[t]<=0){
   data.clock[t]=0;data.out[t]=true;const other=1-t;
   if(!data.out[other]){data.turn=other;message(`انتهى وقت ${names[t]}! الدور الآن لـ ${names[other]}`,"bad")}
   else{endRound();return}
  }
  renderPlay();
 }
}
function endRound(){
 if(data.over)return;data.over=true;clearInterval(timer);
 total[0]+=data.points[0];total[1]+=data.points[1];renderPlay();
 $("guess").disabled=true;$("submit").disabled=true;
 message(`انتهت الجولة! ${names[0]}: ${data.points[0]} نقطة — ${names[1]}: ${data.points[1]} نقطة`,"good");
 $("next").textContent=roundNo===5?"عرض النتيجة النهائية":"الجولة التالية";
 $("next").classList.remove("hidden");
}
function nextRound(){roundNo++;if(used.size>=Object.keys(BANK).length)showFinal();else showPick()}
function showFinal(){
 clearInterval(timer);show("final");
 const diff=total[0]-total[1];
 $("winner").textContent=diff===0?"تعادل! 🤝":`الفائز: ${names[diff>0?0:1]} 🏆`;
 $("finalScores").innerHTML=teamCard(0)+teamCard(1);
}
$("start").onclick=startGame;$("submit").onclick=submitAnswer;
$("guess").addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer()});
$("next").onclick=nextRound;$("restart").onclick=()=>{show("home");clearInterval(timer)};
</script>
